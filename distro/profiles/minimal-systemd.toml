[profile]
name = "minimal-systemd"
description = "First KIKI OS systemd boot target for x86_64 server nodes"
arch = "x86_64"
packages = [
  "base-files",
  "linux",
  "glibc",
  "zlib",
  "expat",
  "openssl",
  "libcap",
  "libseccomp",
  "acl",
  "attr",
  "util-linux",
  "kmod",
  "dbus",
  "systemd",
  "bash",
  "busybox",
  "coreutils",
  "findutils",
  "grep",
  "sed",
  "gawk",
  "tar",
  "gzip",
  "xz",
  "zstd",
  "python",
  "e2fsprogs",
  "shadow",
  "iproute2",
  "ca-certificates",
  "openssh",
  "curl",
  "ki2ctl",
  "kiki-agent",
]

[profile.boot]
init = "/usr/lib/systemd/systemd"
kernel = "/boot/vmlinuz-kiki"

[profile.services]
enable = [
  "systemd-networkd.service",
  "systemd-resolved.service",
  "sshd.service",
  "kiki-agent.service",
]
