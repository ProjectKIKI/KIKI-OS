[profile]
name = "desktop-gnome"
description = "GNOME 50 with native Settings, Files, Console, Mesa and Korean input"
arch = "x86_64"
groups = ["desktop-gnome"]

[profile.boot]
init = "/usr/lib/systemd/systemd"
kernel = "/boot/vmlinuz-kiki"

# Separate signed candidate; original GNOME and server snapshots are preserved.
[profile.prebuilt]
repository = "dist/ki2/gnome-native-apps-20261028-r3"
