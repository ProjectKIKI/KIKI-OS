install_plan:
  name: kiki-kube-node
  description: 쿠버네티스 준비 KIKI 노드를 위한 설치 계획서.
  profile: kiki-kube-node
  target:
    partition_table: gpt
    efi_system_partition:
      size: 512MiB
      filesystem: vfat
      mountpoint: /boot/efi
    root:
      filesystem: ext4
      mountpoint: /
      min_size: 16GiB
    swap:
      enabled: false
      policy: kubernetes-off
  package_sets:
    base:
      - base-files
      - linux
      - ncurses
      - cfdisk
      - systemd
      - openssh
      - ca-certificates
    kubernetes:
      - cri-o
      - conmon
      - crun
      - cni-plugins
      - cri-tools
      - kubelet
      - kubeadm
      - kubectl
      - kube-node-config
    network:
      - iproute2
      - iptables
      - nftables
      - conntrack-tools
      - socat
      - ethtool
      - chrony
      - kiki-installer-tui
    optional_firewall:
      - firewalld
      - bridge-utils
  prompts:
    role:
      default: worker
      choices:
        - control-plane
        - worker
        - standalone
    node_name:
      default: kiki-node
    pod_cidr:
      default: 10.244.0.0/16
    service_cidr:
      default: 10.96.0.0/12
  post_install:
    enable_services:
      - dbus.service
      - getty@tty1.service
      - systemd-logind.service
      - systemd-networkd.service
      - systemd-resolved.service
      - sshd.service
      - crio.service
      - kubelet.service
      - chronyd.service
    write_files:
      - path: /etc/kiki/install-role
        content: ${role}
  runtime:
    container_runtime: cri-o
    cgroup_driver: systemd
    swap_policy: kubernetes-off
  firewall:
    backend: nftables
    firewalld: false
    bridge_tool: iproute2 bridge
