[[recipe]]
name = "wayland-protocols"
version = "1.49"
release = 1
summary = "Wayland desktop protocol XML and generated headers"
license = "MIT"
tier = "library"
architectures = ["x86_64"]
[recipe.source]
type = "url"
url = "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.49/downloads/wayland-protocols-1.49.tar.xz"
file = "wayland-protocols-1.49.tar.xz"
sha256 = "ec4c8f74942d6dff7ace8b4ce4764f0ef9ff618a935d974ea77edee2ad240b14"
[recipe.dependencies]
build = ["linux-headers", "wayland", "libstdcxx"]
runtime = []
[recipe.build]
system = "meson"
inputs = ["distro/specs/harfbuzz-cross.ini", "distro/scripts/ki2-target-pkg-config", "distro/scripts/ki2-target-run", "distro/scripts/ki2-target-wayland-scanner"]
configure = [
  'install -m755 "${KI2_SYSROOT}/usr/bin/wayland-scanner" "${KI2_BUILD_DIR}/wayland-scanner.real"',
  'install -m755 "${KI2_REPO_ROOT}/distro/scripts/ki2-target-wayland-scanner" "${KI2_SYSROOT}/usr/bin/wayland-scanner"',
  'install -Dm755 "${KI2_REPO_ROOT}/distro/scripts/ki2-target-pkg-config" "${KI2_BUILD_DIR}/target-pkg-config"',
  'install -m644 "${KI2_REPO_ROOT}/distro/specs/harfbuzz-cross.ini" "${KI2_BUILD_DIR}/cross.ini"',
  'sed -i -e "s|@BUILD@|${KI2_BUILD_DIR}|g" -e "s|@REPO@|${KI2_REPO_ROOT}|g" "${KI2_BUILD_DIR}/cross.ini"',
  'meson setup "${KI2_BUILD_DIR}/protocols" "${KI2_SOURCE_DIR}" --cross-file "${KI2_BUILD_DIR}/cross.ini" --prefix=/usr --libdir=lib --buildtype=release --wrap-mode=nofallback -Dtests=true',
]
compile = [
  'meson compile -C "${KI2_BUILD_DIR}/protocols" -j "${KI2_JOBS}"',
  'meson test -C "${KI2_BUILD_DIR}/protocols" --no-rebuild --print-errorlogs',
]
install = [
  'DESTDIR="${KI2_DESTDIR}" meson install -C "${KI2_BUILD_DIR}/protocols"',
  'install -Dm644 "${KI2_SOURCE_DIR}/COPYING" "${KI2_DESTDIR}/usr/share/licenses/wayland-protocols/COPYING"',
  'test -s "${KI2_DESTDIR}/usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml"',
]
[recipe.build.env]
CFLAGS = "--sysroot=${KI2_SYSROOT} ${KI2_SYSROOT_CPPFLAGS} -O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2"
CXXFLAGS = "--sysroot=${KI2_SYSROOT} ${KI2_SYSROOT_CPPFLAGS} -O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2"
LDFLAGS = "--sysroot=${KI2_SYSROOT} -B${KI2_SYSROOT}/usr/lib64/ -B${KI2_SYSROOT}/lib64/ ${KI2_SYSROOT_LDFLAGS} -Wl,-z,relro,-z,now"
