# 선택 쿠버네티스 노드 패키지 계층.
#
# 이 YAML 레시피는 우선 의존성 해석기가 볼 수 있는 패키지 메타데이터로 시작한다.
# KIKI 패키지 빌더의 Go/cross-build 지원이 커지면 런타임 바이너리 빌드를
# 레시피별로 채워 넣는다.

recipes:
  - name: cri-o
    version: "1.36.0"
    release: 1
    summary: OCI 런타임을 직접 사용하는 쿠버네티스 중심 CRI 런타임
    license: Apache-2.0
    tier: kubernetes
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - conmon
        - crun
        - glibc
        - libseccomp
        - systemd
    build:
      system: virtual

  - name: conmon
    version: "2.1.13"
    release: 1
    summary: CRI-O가 OCI 컨테이너를 감시할 때 사용하는 컨테이너 모니터
    license: Apache-2.0
    tier: kubernetes
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - glibc
    build:
      system: virtual

  - name: crun
    version: "1.23.1"
    release: 1
    summary: CRI-O와 cgroup v2 기반 쿠버네티스 노드를 위한 OCI 런타임
    license: Apache-2.0
    tier: kubernetes
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - glibc
        - libseccomp
    build:
      system: virtual

  - name: cni-plugins
    version: "1.7.0"
    release: 1
    summary: pod 네트워크 bootstrap을 위한 표준 CNI 플러그인
    license: Apache-2.0
    tier: kubernetes
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - glibc
        - iproute2
    build:
      system: virtual

  - name: cri-tools
    version: "1.36.0"
    release: 1
    summary: kubelet과 CRI-O 운영을 위한 crictl 및 CRI 검증 도구
    license: Apache-2.0
    tier: kubernetes
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - glibc
        - cri-o
    build:
      system: virtual

  - name: kubelet
    version: "1.36.1"
    release: 1
    summary: systemd가 관리하는 쿠버네티스 노드 에이전트
    license: Apache-2.0
    tier: kubernetes
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - glibc
        - systemd
        - cri-o
        - cni-plugins
        - cri-tools
        - conntrack-tools
        - e2fsprogs
        - iproute2
        - iptables
        - socat
    build:
      system: virtual

  - name: kubeadm
    version: "1.36.1"
    release: 1
    summary: 쿠버네티스 클러스터 bootstrap 및 join 도구
    license: Apache-2.0
    tier: kubernetes
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - ca-certificates
        - cri-tools
        - kubelet
        - kubectl
    build:
      system: virtual

  - name: kubectl
    version: "1.36.1"
    release: 1
    summary: 쿠버네티스 명령행 클라이언트
    license: Apache-2.0
    tier: kubernetes
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - ca-certificates
        - glibc
    build:
      system: virtual

  - name: conntrack-tools
    version: "1.4.8"
    release: 1
    summary: kube-proxy와 kubelet 점검에 필요한 connection tracking 도구
    license: GPL-2.0-or-later
    tier: kubernetes
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - glibc
    build:
      system: virtual

  - name: iptables
    version: "1.8.11"
    release: 1
    summary: 쿠버네티스 네트워크를 위한 iptables/nft 호환 도구
    license: GPL-2.0-only
    tier: network
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - glibc
        - nftables
    build:
      system: virtual

  - name: nftables
    version: "1.1.1"
    release: 1
    summary: nft userspace 방화벽 도구
    license: GPL-2.0-only
    tier: network
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - glibc
    build:
      system: virtual

  - name: socat
    version: "1.8.0.3"
    release: 1
    summary: kubeadm workflow에 필요한 양방향 relay 도구
    license: GPL-2.0-only
    tier: network
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - glibc
        - openssl
    build:
      system: virtual

  - name: ethtool
    version: "6.15"
    release: 1
    summary: 이더넷 장치 점검 및 튜닝 도구
    license: GPL-2.0-only
    tier: network
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - glibc
    build:
      system: virtual

  - name: chrony
    version: "4.7"
    release: 1
    summary: 쿠버네티스 노드 시간 동기화를 위한 NTP client/server
    license: GPL-2.0-only
    tier: network
    architectures:
      - x86_64
    source:
      type: virtual
    depends:
      build: []
      runtime:
        - glibc
        - openssl
    build:
      system: virtual

  - name: kube-node-config
    version: "0.1.0"
    release: 1
    summary: CRI-O, kubelet, sysctl, CNI bootstrap을 위한 KIKI 기본 설정
    license: GPL-3.0-or-later
    tier: kiki
    architectures:
      - all
    source:
      type: local
      path: distro/sources/kube-node-config
    depends:
      build: []
      runtime:
        - cri-o
        - kubelet
        - systemd
    build:
      system: copy
