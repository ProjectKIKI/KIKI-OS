# KIKI Stage 2 Kubernetes and node-runtime package catalog.
#
# Stage 2 packages use pinned upstream release binaries where available. A few
# early node userspace packages are wrapped from the builder host so the ISO can
# exercise real kubeadm/firewall/time-sync paths before Stage 3 source rebuilds.

recipes:
  - name: libffi
    version: "3.4.8"
    release: 2
    summary: Foreign function interface library for GLib and Python bindings
    license: MIT
    tier: base
    architectures: [x86_64]
    source:
      type: url
      url: https://github.com/libffi/libffi/releases/download/v3.4.8/libffi-3.4.8.tar.gz
      file: libffi-3.4.8.tar.gz
      sha256: bc9842a18898bfacb0ed1252c4febcc7e78fa139fd27fdc7a3e30d9d9356119b
    depends:
      build: [linux-headers]
      runtime: [glibc]
    build:
      system: gnu
      configure:
        - cd "${KI2_SOURCE_DIR}" && ./configure --prefix=/usr --libdir=/usr/lib --build=x86_64-pc-linux-gnu --host=${KI2_TARGET_TRIPLE} --disable-static --enable-shared --disable-docs --disable-multi-os-directory
      compile:
        - make -C "${KI2_SOURCE_DIR}" -j"${KI2_JOBS}"
      install:
        - make -C "${KI2_SOURCE_DIR}" DESTDIR="${KI2_DESTDIR}" install
        - rm -f "${KI2_DESTDIR}/usr/lib/libffi.la"
        - install -Dm644 "${KI2_SOURCE_DIR}/LICENSE" "${KI2_DESTDIR}/usr/share/licenses/libffi/LICENSE"
        - readelf -d "${KI2_DESTDIR}/usr/lib/libffi.so.8" > "${KI2_BUILD_DIR}/elf-dynamic.txt" && ! grep -E "RPATH|RUNPATH" "${KI2_BUILD_DIR}/elf-dynamic.txt"
      env:
        CC: "cc --sysroot=${KI2_SYSROOT}"
        CFLAGS: "--sysroot=${KI2_SYSROOT} ${KI2_SYSROOT_CPPFLAGS} -O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2"
        LDFLAGS: "--sysroot=${KI2_SYSROOT} -B${KI2_SYSROOT}/usr/lib64/ -B${KI2_SYSROOT}/lib64/ ${KI2_SYSROOT_LDFLAGS} -Wl,-z,relro,-z,now"

  - name: pcre2
    version: "10.46"
    release: 2
    summary: Perl-compatible regular expression library for GLib
    license: BSD-3-Clause
    tier: base
    architectures: [x86_64]
    source:
      type: url
      url: https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.46/pcre2-10.46.tar.bz2
      file: pcre2-10.46.tar.bz2
      sha256: 15fbc5aba6beee0b17aecb04602ae39432393aba1ebd8e39b7cabf7db883299f
    depends:
      build: []
      runtime: [glibc]
    build:
      system: gnu
      sysroot_exclude: [glibc]
      configure:
        - cd "${KI2_SOURCE_DIR}" && ./configure --prefix=/usr --libdir=/usr/lib --disable-static --enable-shared --enable-pcre2-8 --disable-pcre2-16 --disable-pcre2-32 --enable-unicode --enable-jit
      compile:
        - make -C "${KI2_SOURCE_DIR}" -j"${KI2_JOBS}"
      install:
        - make -C "${KI2_SOURCE_DIR}" DESTDIR="${KI2_DESTDIR}" install
        - find "${KI2_DESTDIR}/usr/lib" -name '*.la' -delete
      env:
        CFLAGS: "-O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2"
        LDFLAGS: "-Wl,-z,relro,-z,now"

  - name: glib
    version: "2.84.4"
    release: 2
    summary: Core event loop, object system, and GIO runtime
    license: LGPL-2.1-or-later
    tier: base
    architectures: [x86_64]
    source:
      type: url
      url: https://download.gnome.org/sources/glib/2.84/glib-2.84.4.tar.xz
      file: glib-2.84.4.tar.xz
      sha256: 8a9ea10943c36fc117e253f80c91e477b673525ae45762942858aef57631bb90
    depends:
      build: [linux-headers, libffi, pcre2, zlib]
      runtime: [glibc, libffi, pcre2, zlib]
    build:
      system: meson
      inputs: [distro/specs/graphics-cross.ini, distro/scripts/ki2-target-pkg-config, distro/scripts/ki2-target-run]
      configure_options: [-Ddefault_library=shared, -Dbuildtype=release, -Dtests=false, -Dinstalled_tests=false, -Ddocumentation=false, -Dman-pages=disabled, -Dnls=disabled, -Dglib_debug=disabled, -Dselinux=disabled, -Dlibmount=disabled, -Dlibelf=disabled, -Dsysprof=disabled, -Ddtrace=disabled, -Dsystemtap=disabled, -Dintrospection=disabled]
      configure:
        - install -Dm755 "${KI2_REPO_ROOT}/distro/scripts/ki2-target-pkg-config" "${KI2_BUILD_DIR}/target-pkg-config"
        - install -m644 "${KI2_REPO_ROOT}/distro/specs/graphics-cross.ini" "${KI2_BUILD_DIR}/cross.ini"
        - sed -i -e "s|@BUILD@|${KI2_BUILD_DIR}|g" -e "s|@REPO@|${KI2_REPO_ROOT}|g" "${KI2_BUILD_DIR}/cross.ini"
        - meson setup "${KI2_BUILD_DIR}/glib" "${KI2_SOURCE_DIR}" --cross-file "${KI2_BUILD_DIR}/cross.ini" --prefix=/usr --libdir=lib -Ddefault_library=shared -Dbuildtype=release -Dtests=false -Dinstalled_tests=false -Ddocumentation=false -Dman-pages=disabled -Dnls=disabled -Dglib_debug=disabled -Dselinux=disabled -Dlibmount=disabled -Dlibelf=disabled -Dsysprof=disabled -Ddtrace=disabled -Dsystemtap=disabled -Dintrospection=disabled
      compile:
        - meson compile -C "${KI2_BUILD_DIR}/glib" -j "${KI2_JOBS}"
      install:
        - DESTDIR="${KI2_DESTDIR}" meson install -C "${KI2_BUILD_DIR}/glib"
      env:
        CFLAGS: "--sysroot=${KI2_SYSROOT} ${KI2_SYSROOT_CPPFLAGS} -O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2"
        LDFLAGS: "--sysroot=${KI2_SYSROOT} -B${KI2_SYSROOT}/usr/lib64/ -B${KI2_SYSROOT}/lib64/ ${KI2_SYSROOT_LDFLAGS} -Wl,-z,relro,-z,now"

  - name: python-setuptools
    version: "84.0.0"
    release: 2
    summary: Python packaging bootstrap and distutils compatibility runtime
    license: MIT
    tier: runtime
    architectures: [x86_64]
    source:
      type: url
      url: https://files.pythonhosted.org/packages/6d/44/f5da03a8ef95d369145c5bb53050e7877c9f3d312e128605fd9504829143/setuptools-84.0.0.tar.gz
      file: setuptools-84.0.0.tar.gz
      sha256: f4695c21257f0d9b537ec2692c941d02ee143b7cc1276941349a546573b2ef73
    depends:
      build: [python]
      runtime: [python]
    build:
      system: python
      sysroot_exclude: [glibc]
      install:
        - install -Dm755 "${KI2_REPO_ROOT}/distro/scripts/ki2-target-python3" "${KI2_BUILD_DIR}/target-python3"
        - cd "${KI2_SOURCE_DIR}" && "${KI2_BUILD_DIR}/target-python3" setup.py install --root="${KI2_DESTDIR}" --prefix=/usr --single-version-externally-managed --record="${KI2_BUILD_DIR}/setuptools-files.txt"
        - find "${KI2_DESTDIR}/usr/lib/python3.12" -type f -name '*.pyc' -delete
        - find "${KI2_DESTDIR}/usr/lib/python3.12" -depth -type d -name '__pycache__' -empty -delete
        - find "${KI2_DESTDIR}" -type f -name '*.exe' -delete
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONHASHSEED: "0"

  - name: gobject-introspection
    version: "1.84.0"
    release: 7
    summary: GObject introspection tools, GIR metadata, and typelib runtime
    license: LGPL-2.1-or-later AND GPL-2.0-or-later
    tier: runtime
    architectures: [x86_64]
    source:
      type: url
      url: https://download.gnome.org/sources/gobject-introspection/1.84/gobject-introspection-1.84.0.tar.xz
      file: gobject-introspection-1.84.0.tar.xz
      sha256: 945b57da7ec262e5c266b89e091d14be800cc424277d82a02872b7d794a84779
      extra:
        - url: https://download.gnome.org/sources/glib/2.84/glib-2.84.4.tar.xz
          file: glib-2.84.4.tar.xz
          sha256: 8a9ea10943c36fc117e253f80c91e477b673525ae45762942858aef57631bb90
    depends:
      build: [linux-headers, glib, libffi, python, python-setuptools]
      runtime: [glib, libffi, python, python-setuptools]
    build:
      system: meson
      inputs: [distro/specs/graphics-cross.ini, distro/scripts/ki2-target-python3, distro/scripts/ki2-target-pkg-config, distro/scripts/ki2-target-run, distro/scripts/ki2-target-g-ir-scanner, distro/scripts/ki2-target-g-ir-compiler]
      configure_options: [-Ddefault_library=shared, -Dbuildtype=release, -Dcairo=disabled, -Ddoctool=disabled, -Dgtk_doc=false, -Dtests=false, -Dbuild_introspection_data=true, -Dpython.platlibdir=lib/python3.12/site-packages, -Dpython.purelibdir=lib/python3.12/site-packages]
      configure:
        - install -Dm755 "${KI2_REPO_ROOT}/distro/scripts/ki2-target-python3" "${KI2_BUILD_DIR}/target-python3"
        - install -Dm755 "${KI2_REPO_ROOT}/distro/scripts/ki2-target-pkg-config" "${KI2_BUILD_DIR}/target-pkg-config"
        - install -m644 "${KI2_REPO_ROOT}/distro/specs/graphics-cross.ini" "${KI2_BUILD_DIR}/cross.ini"
        - sed -i -e "s|@BUILD@|${KI2_BUILD_DIR}|g" -e "s|@REPO@|${KI2_REPO_ROOT}|g" "${KI2_BUILD_DIR}/cross.ini"
        - meson setup "${KI2_BUILD_DIR}/gobject-introspection" "${KI2_SOURCE_DIR}/gobject-introspection-1.84.0" --cross-file "${KI2_BUILD_DIR}/cross.ini" --prefix=/usr --libdir=lib -Ddefault_library=shared -Dbuildtype=release -Dcairo=disabled -Ddoctool=disabled -Dgtk_doc=false -Dtests=false -Dbuild_introspection_data=true -Dpython="${KI2_BUILD_DIR}/target-python3" -Dpython.platlibdir=lib/python3.12/site-packages -Dpython.purelibdir=lib/python3.12/site-packages
      compile:
        - meson compile -C "${KI2_BUILD_DIR}/gobject-introspection" -j "${KI2_JOBS}"
      install:
        - DESTDIR="${KI2_DESTDIR}" meson install -C "${KI2_BUILD_DIR}/gobject-introspection"
        - for tool in g-ir-scanner g-ir-annotation-tool; do sed -i '1c #!/usr/bin/python3' "${KI2_DESTDIR}/usr/bin/${tool}"; done
        - cp -a "${KI2_DESTDIR}/usr/." "${KI2_SYSROOT}/usr/"
        - sed -i "1c #!/usr/bin/env ${KI2_BUILD_DIR}/target-python3" "${KI2_SYSROOT}/usr/bin/g-ir-scanner"
        - install -Dm755 "${KI2_REPO_ROOT}/distro/scripts/ki2-target-g-ir-scanner" "${KI2_BUILD_DIR}/glib-tools/g-ir-scanner"
        - install -m755 "${KI2_SYSROOT}/usr/bin/g-ir-compiler" "${KI2_BUILD_DIR}/g-ir-compiler.real"
        - install -m755 "${KI2_REPO_ROOT}/distro/scripts/ki2-target-g-ir-compiler" "${KI2_SYSROOT}/usr/bin/g-ir-compiler"
        - 'PATH="${KI2_BUILD_DIR}/glib-tools:$PATH" meson setup "${KI2_BUILD_DIR}/glib-introspection" "${KI2_SOURCE_DIR}/glib-2.84.4" --cross-file "${KI2_BUILD_DIR}/cross.ini" --prefix=/usr --libdir=lib -Ddefault_library=shared -Dbuildtype=release -Dtests=false -Dinstalled_tests=false -Ddocumentation=false -Dman-pages=disabled -Dnls=disabled -Dglib_debug=disabled -Dselinux=disabled -Dlibmount=disabled -Dlibelf=disabled -Dsysprof=disabled -Ddtrace=disabled -Dsystemtap=disabled -Dintrospection=enabled'
        - ninja -C "${KI2_BUILD_DIR}/glib-introspection" -j "${KI2_JOBS}"
        - mkdir -p "${KI2_BUILD_DIR}/glib-introspection-install" && DESTDIR="${KI2_BUILD_DIR}/glib-introspection-install" ninja -C "${KI2_BUILD_DIR}/glib-introspection" install
        - mkdir -p "${KI2_DESTDIR}/usr/share/gir-1.0" "${KI2_DESTDIR}/usr/lib/girepository-1.0"
        - find "${KI2_BUILD_DIR}/glib-introspection-install/usr/share/gir-1.0" -maxdepth 1 -type f -name '*.gir' -exec install -m644 '{}' "${KI2_DESTDIR}/usr/share/gir-1.0/" ';'
        - find "${KI2_BUILD_DIR}/glib-introspection-install/usr/lib/girepository-1.0" -maxdepth 1 -type f -name '*.typelib' -exec install -m644 '{}' "${KI2_DESTDIR}/usr/lib/girepository-1.0/" ';'
        - find "${KI2_DESTDIR}/usr" -type f -name '*.pyc' -delete
        - find "${KI2_DESTDIR}/usr" -depth -type d -name '__pycache__' -empty -delete
        - find "${KI2_DESTDIR}/usr/lib" -name '*.a' -delete
      env:
        CPPFLAGS: "${KI2_SYSROOT_CPPFLAGS}"
        CFLAGS: "--sysroot=${KI2_SYSROOT} ${KI2_SYSROOT_CPPFLAGS} -O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2"
        LDFLAGS: "--sysroot=${KI2_SYSROOT} -B${KI2_SYSROOT}/usr/lib64/ -B${KI2_SYSROOT}/lib64/ ${KI2_SYSROOT_LDFLAGS} -Wl,-z,relro,-z,now"
        PKG_CONFIG: "${KI2_BUILD_DIR}/target-pkg-config"
        KI2_USE_TARGET_LOADER: "1"
        GI_CROSS_LAUNCHER: "/bin/sh ${KI2_REPO_ROOT}/distro/scripts/ki2-target-run"
        KI2_SYSROOT_LIBRARY_PATH: "${KI2_BUILD_DIR}/gobject-introspection/girepository:${KI2_BUILD_DIR}/glib-introspection/glib:${KI2_BUILD_DIR}/glib-introspection/gobject:${KI2_BUILD_DIR}/glib-introspection/gio:${KI2_SYSROOT_LIBRARY_PATH}"
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONHASHSEED: "0"

  - name: python3-dbus
    version: "1.4.0"
    release: 3
    summary: Python 3 bindings for the D-Bus message bus
    license: MIT
    tier: runtime
    architectures: [x86_64]
    source:
      type: url
      url: https://dbus.freedesktop.org/releases/dbus-python/dbus-python-1.4.0.tar.xz
      file: dbus-python-1.4.0.tar.xz
      sha256: c36b28f10ffcc8f1f798aca973bcc132f91f33eb9b6b8904381b4077766043d5
    depends:
      build: [dbus, glib, python]
      runtime: [dbus, glib, python]
    build:
      system: meson
      sysroot_exclude: [glibc]
      configure_options: [-Dbuildtype=release, -Ddoc=disabled, -Dinstalled_tests=false, -Dtests=disabled, -Dpython.platlibdir=lib/python3.12/site-packages, -Dpython.purelibdir=lib/python3.12/site-packages]
      configure:
        - install -Dm755 "${KI2_REPO_ROOT}/distro/scripts/ki2-target-python3" "${KI2_BUILD_DIR}/target-python3"
        - meson setup "${KI2_BUILD_DIR}/python3-dbus" "${KI2_SOURCE_DIR}" --prefix=/usr --libdir=lib -Dbuildtype=release -Ddoc=disabled -Dinstalled_tests=false -Dtests=disabled -Dpython="${KI2_BUILD_DIR}/target-python3" -Dpython.platlibdir=lib/python3.12/site-packages -Dpython.purelibdir=lib/python3.12/site-packages
      compile:
        - meson compile -C "${KI2_BUILD_DIR}/python3-dbus" -j "${KI2_JOBS}"
      install:
        - DESTDIR="${KI2_DESTDIR}" meson install -C "${KI2_BUILD_DIR}/python3-dbus"
        - find "${KI2_DESTDIR}/usr/lib/python3.12" -type f -name '*.pyc' -delete
        - find "${KI2_DESTDIR}/usr/lib/python3.12" -depth -type d -name '__pycache__' -empty -delete
        - find "${KI2_DESTDIR}/usr/lib/python3.12" -type f -exec sh -c 'for binary do file "${binary}" | grep -q ELF && strip --strip-unneeded "${binary}" || true; done' sh '{}' +
      env:
        CPPFLAGS: "${KI2_SYSROOT_CPPFLAGS}"
        CFLAGS: "${KI2_SYSROOT_CPPFLAGS} -O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2 -ffile-prefix-map=${KI2_WORK}=/usr/src/python3-dbus -fdebug-prefix-map=${KI2_WORK}=/usr/src/python3-dbus -ffile-prefix-map=${KI2_SYSROOT}=/usr -fdebug-prefix-map=${KI2_SYSROOT}=/usr"
        LDFLAGS: "${KI2_SYSROOT_LDFLAGS} -Wl,-z,relro,-z,now"
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONHASHSEED: "0"

  - name: python3-gobject
    version: "3.52.3"
    release: 3
    summary: Python 3 bindings for GLib and GObject Introspection
    license: LGPL-2.1-or-later
    tier: runtime
    architectures: [x86_64]
    source:
      type: url
      url: https://download.gnome.org/sources/pygobject/3.52/pygobject-3.52.3.tar.gz
      file: pygobject-3.52.3.tar.gz
      sha256: 00e427d291e957462a8fad659a9f9c8be776ff82a8b76bdf402f1eaeec086d82
    depends:
      build: [glib, gobject-introspection, libffi, python]
