[[recipe]]
name = "xcb-proto"
version = "1.17.0"
release = 1
summary = "XCB protocol XML and Python code generator modules"
license = "MIT"
tier = "library"
architectures = ["x86_64"]
[recipe.source]
type = "url"
url = "https://www.x.org/releases/individual/proto/xcb-proto-1.17.0.tar.xz"
file = "xcb-proto-1.17.0.tar.xz"
sha256 = "2c1bacd2110f4799f74de6ebb714b94cf6f80fb112316b1219480fd22562148c"
[recipe.dependencies]
build = ["libxml2"]
runtime = ["python"]
[recipe.build]
system = "autotools"
inputs = ["distro/scripts/ki2-target-python3", "distro/scripts/ki2-target-run"]
configure = [
  'install -Dm755 "${KI2_REPO_ROOT}/distro/scripts/ki2-target-python3" "${KI2_BUILD_DIR}/target-python3"',
  'mkdir -p "${KI2_BUILD_DIR}/xcb-proto" && cd "${KI2_BUILD_DIR}/xcb-proto" && PYTHON="${KI2_BUILD_DIR}/target-python3" "${KI2_SOURCE_DIR}/configure" --prefix=/usr --libdir=/usr/lib pythondir=/usr/lib/python3.12/site-packages',
]
compile = [
  'make -C "${KI2_BUILD_DIR}/xcb-proto" -j "${KI2_JOBS}"',
  '/bin/sh "${KI2_REPO_ROOT}/distro/scripts/ki2-target-run" "${KI2_SYSROOT}/usr/bin/xmllint" --noout --schema "${KI2_SOURCE_DIR}/src/xcb.xsd" "${KI2_SOURCE_DIR}"/src/*.xml',
]
install = [
  'make -C "${KI2_BUILD_DIR}/xcb-proto" DESTDIR="${KI2_DESTDIR}" install',
  'install -Dm644 "${KI2_SOURCE_DIR}/COPYING" "${KI2_DESTDIR}/usr/share/licenses/xcb-proto/COPYING"',
  'test -s "${KI2_DESTDIR}/usr/share/xcb/xkb.xml" && test -s "${KI2_DESTDIR}/usr/lib/python3.12/site-packages/xcbgen/state.py"',
]
[recipe.build.env]
KI2_USE_TARGET_LOADER = "1"
