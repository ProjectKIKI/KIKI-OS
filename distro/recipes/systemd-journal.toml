  'install -Dm644 "${KI2_SOURCE_DIR}/src/journal-remote/browse.html" "${KI2_DESTDIR}/usr/share/systemd/gatewayd/browse.html"',
  'install -Dm644 "${KI2_SOURCE_DIR}/LICENSE.LGPL2.1" "${KI2_DESTDIR}/usr/share/licenses/systemd-journal-gatewayd/LICENSE.LGPL2.1"',
