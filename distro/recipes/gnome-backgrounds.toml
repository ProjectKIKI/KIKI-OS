[[recipe]]
name = "gnome-backgrounds"
version = "50.0"
release = 1
summary = "GNOME 50 desktop background artwork"
license = "CC-BY-SA-3.0-US"
tier = "desktop"
architectures = ["x86_64"]
[recipe.source]
type = "url"
url = "https://download.gnome.org/sources/gnome-backgrounds/50/gnome-backgrounds-50.0.tar.xz"
file = "gnome-backgrounds-50.0.tar.xz"
sha256 = "1acdba7acb4f34c7321febc6273444344fd55fd593611d446de70860183b52b8"
[recipe.dependencies]
build = ["glib"]
runtime = []
[recipe.build]
system = "meson"
configure = ['meson setup "${KI2_BUILD_DIR}/meson" "${KI2_SOURCE_DIR}" --prefix=/usr --libdir=lib --buildtype=release']
compile = ['meson compile -C "${KI2_BUILD_DIR}/meson" -j "${KI2_JOBS}"']
install = [
  'DESTDIR="${KI2_DESTDIR}" meson install -C "${KI2_BUILD_DIR}/meson"',
  'install -Dm644 "${KI2_SOURCE_DIR}/COPYING" "${KI2_DESTDIR}/usr/share/licenses/gnome-backgrounds/COPYING"',
]
