[[recipe]]
name = "systemd"
version = "255.7"
release = 2
summary = "System and service manager for KIKI OS"
license = "LGPL-2.1-or-later"
tier = "base"
architectures = ["x86_64"]
[recipe.source]
type = "url"
url = "https://github.com/systemd/systemd-stable/archive/refs/tags/v255.7.tar.gz"
sha256 = "da29f2490c192ca743511098b1d15e385b1b5e7744979661dc30514c1ac61f0e"
[recipe.dependencies]
build = []
runtime = ["glibc", "acl", "dbus", "kmod", "libcap", "libseccomp", "libxcrypt", "openssl", "util-linux", "xz", "zlib", "zstd"]
[recipe.build]
system = "meson"
patches = ["distro/patches/systemd/0001-include-linux-mount-before-fallback-macros.patch"]
env.CFLAGS = "--sysroot=${KI2_SYSROOT}"
env.LDFLAGS = "--sysroot=${KI2_SYSROOT} -B${KI2_SYSROOT}/usr/lib64/ -B${KI2_SYSROOT}/lib64/ -L${KI2_SYSROOT}/usr/lib64 -L${KI2_SYSROOT}/lib64 -L${KI2_SYSROOT}/usr/lib -Wl,-rpath-link=${KI2_SYSROOT}/lib64 -Wl,-rpath-link=${KI2_SYSROOT}/usr/lib64 -Wl,-rpath-link=${KI2_SYSROOT}/usr/lib"
configure_options = [
  "-Ddefault-dnssec=no",
  "-Dfirstboot=false",
  "-Dman=false",
  "-Dtests=false",
  "-Ddbus-interfaces-dir=no",
  "-Dc_args=-Wno-error=shift-overflow"
]

