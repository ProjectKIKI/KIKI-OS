# KIKI OS initial package catalog.
#
# Scope rule for this first independent-distribution pass:
# - Keep the seed catalog small enough for stage-1 VM iteration.
# - Prefer systemd/glibc/server-node viability over desktop breadth.
# - Treat the host/container toolchain as the phase-0 bootstrap toolchain.

[[recipe]]
name = "base-files"
version = "0.1.0"
release = 19
summary = "KIKI filesystem skeleton, os-release, and default system layout"
license = "GPL-3.0-or-later"
tier = "base"
architectures = ["all"]
[recipe.source]
type = "local"
path = "distro/sources/base-files"
[recipe.dependencies]
build = []
runtime = []
[recipe.build]
system = "copy"

[[recipe]]
name = "linux"
version = "6.1.187"
release = 2
summary = "Linux kernel for KIKI OS"
license = "GPL-2.0-only"
tier = "kernel"
architectures = ["x86_64"]
[recipe.source]
type = "url"
url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.187.tar.xz"
sha256 = "1b6e798aeaa708ca670a426ad5a6c86dc2237b8e59e8822876976c383873642b"
[recipe.dependencies]
build = []
runtime = []
[recipe.build]
system = "kernel"
config_fragments = ["distro/kernel/x86_64-vm-stage1.config"]
strip_module_build_links = true

[[recipe]]
name = "linux-headers"
version = "6.1.187"
