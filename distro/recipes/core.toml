sha256 = "ee14b4c5d8908b1bec37ad937607eab183d4d9806a08adee472c3c3121d27364"
[recipe.dependencies]
build = []
runtime = ["glibc"]
[recipe.build]
system = "gnu"
sysroot_exclude = ["glibc"]
