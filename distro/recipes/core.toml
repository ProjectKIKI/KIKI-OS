# KIKI OS initial package catalog.
#
# Scope rule for this first independent-distribution pass:
# - Keep the seed catalog at 40 packages or fewer.
# - Prefer systemd/glibc/server-node viability over desktop breadth.
# - Treat the host/container toolchain as the phase-0 bootstrap toolchain.

[[recipe]]
name = "base-files"
version = "0.1.0"
release = 16
summary = "KIKI filesystem skeleton, os-release, and default system layout"
license = "GPL-3.0-or-later"
tier = "base"
architectures = ["all"]
[recipe.source]
type = "local"
path = "distro/sources/base-files"
[recipe.dependencies]
build = []
runtime = []
[recipe.build]
system = "copy"

[[recipe]]
name = "linux"
version = "6.9.9"
release = 2
summary = "Linux kernel for KIKI OS"
license = "GPL-2.0-only"
tier = "kernel"
architectures = ["x86_64"]
[recipe.source]
type = "url"
url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.9.9.tar.xz"
sha256 = "2be05b487eb239a3bf687d628a8f104177d09c310f00bcc2a5e50f1733421eb9"
[recipe.dependencies]
build = []
runtime = []
[recipe.build]
system = "kernel"
config_fragments = ["distro/kernel/x86_64-vm-stage1.config"]
strip_module_build_links = true

