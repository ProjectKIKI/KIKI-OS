[[recipe]]
name = "dbus"
version = "1.14.10"
release = 7
summary = "System message bus"
license = "AFL-2.1 OR GPL-2.0-or-later"
tier = "base"
architectures = ["x86_64"]
[recipe.source]
type = "url"
url = "https://dbus.freedesktop.org/releases/dbus/dbus-1.14.10.tar.xz"
sha256 = "ba1f21d2bd9d339da2d4aa8780c09df32fea87998b73da24f49ab9df1e36a50f"
[recipe.dependencies]
build = ["expat"]
runtime = ["glibc", "expat"]
[recipe.build]
system = "gnu"
sysroot_exclude = ["glibc"]
configure_options = ["--sysconfdir=/etc", "--localstatedir=/var", "--runstatedir=/run", "--with-system-socket=/run/dbus/system_bus_socket", "--disable-static"]
configure = [
  "find ${KI2_SYSROOT}/usr/lib -type f -name '*.la' -delete",
  "cd ${KI2_SOURCE_DIR} && ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --runstatedir=/run --with-system-socket=/run/dbus/system_bus_socket --disable-static",
  "sed -i 's/^hardcode_libdir_flag_spec=.*/hardcode_libdir_flag_spec=\"\"/' ${KI2_SOURCE_DIR}/libtool"
]
compile = ["make -C ${KI2_SOURCE_DIR} -j${KI2_JOBS}"]
install = [
  "make -C ${KI2_SOURCE_DIR} DESTDIR=${KI2_DESTDIR} install",
  "find ${KI2_DESTDIR}/usr/lib -name '*.la' -delete",
  "find ${KI2_DESTDIR}/usr/bin ${KI2_DESTDIR}/usr/lib ${KI2_DESTDIR}/usr/libexec -type f -exec sh -c 'for binary do file \"${binary}\" | grep -q ELF && strip --strip-unneeded \"${binary}\" || true; done' sh {} +"
]
env.CPPFLAGS = "${KI2_SYSROOT_CPPFLAGS}"
env.CFLAGS = "${KI2_SYSROOT_CPPFLAGS} -O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2 -ffile-prefix-map=${KI2_WORK}=/usr/src/dbus -fdebug-prefix-map=${KI2_WORK}=/usr/src/dbus -ffile-prefix-map=${KI2_SYSROOT}=/usr -fdebug-prefix-map=${KI2_SYSROOT}=/usr"
env.LDFLAGS = "${KI2_SYSROOT_LDFLAGS} -Wl,-z,relro,-z,now"
env.TMPDIR = "/tmp"

[[recipe]]
name = "systemd"
version = "255.7"
release = 3
summary = "System and service manager for KIKI OS"
license = "LGPL-2.1-or-later"
tier = "base"
architectures = ["x86_64"]
[recipe.source]
type = "url"
url = "https://github.com/systemd/systemd-stable/archive/refs/tags/v255.7.tar.gz"
sha256 = "da29f2490c192ca743511098b1d15e385b1b5e7744979661dc30514c1ac61f0e"
[recipe.dependencies]
build = []
runtime = ["glibc", "acl", "dbus", "kmod", "libcap", "libseccomp", "libxcrypt", "openssl", "util-linux", "xz", "zlib", "zstd"]
[recipe.build]
system = "meson"
patches = ["distro/patches/systemd/0001-include-linux-mount-before-fallback-macros.patch"]
env.CFLAGS = "--sysroot=${KI2_SYSROOT}"
env.LDFLAGS = "--sysroot=${KI2_SYSROOT} -B${KI2_SYSROOT}/usr/lib64/ -B${KI2_SYSROOT}/lib64/ -L${KI2_SYSROOT}/usr/lib64 -L${KI2_SYSROOT}/lib64 -L${KI2_SYSROOT}/usr/lib -Wl,-rpath-link=${KI2_SYSROOT}/lib64 -Wl,-rpath-link=${KI2_SYSROOT}/usr/lib64 -Wl,-rpath-link=${KI2_SYSROOT}/usr/lib"
configure_options = [
  "-Ddefault-dnssec=no",
  "-Dfirstboot=false",
  "-Dmachined=true",
  "-Dman=false",
  "-Dtests=false",
  "-Ddbus-interfaces-dir=no",
  "-Dc_args=-Wno-error=shift-overflow"
]

