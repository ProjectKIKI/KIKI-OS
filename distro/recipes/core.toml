  "--without-pam",
  "--without-ldap"
]
configure = ["cd ${KI2_SOURCE_DIR} && ./configure --prefix=/usr --sysconfdir=/etc --with-rundir=/run/sudo --disable-log-server --disable-openssl --without-pam --without-ldap"]
compile = ["make -C ${KI2_SOURCE_DIR} -j${KI2_JOBS}"]
install = ["make -C ${KI2_SOURCE_DIR} DESTDIR=${KI2_DESTDIR} INSTALL_OWNER= install"]

