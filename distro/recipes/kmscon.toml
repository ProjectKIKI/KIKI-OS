[[recipe]]
name = "kiki-kmscon"
version = "10.0.3"
release = 3
summary = "Korean KMS console with Naver NanumGothicCoding and Noto fallback"
license = "MIT AND LGPL-2.1-or-later AND OFL-1.1"
tier = "base"
