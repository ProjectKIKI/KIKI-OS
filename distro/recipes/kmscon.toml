[recipe.source]
type = "local"
path = "build/ki2/host-kmscon-ko/rootfs"
inputs = ["tools/ki2kmscon.py", "distro/sources/kiki-kmscon"]
[recipe.dependencies]
build = []
runtime = ["glibc"]
[recipe.build]
system = "copy"
skip_sysroot = true
