type = "url"
url = "https://download.gnome.org/sources/gsettings-desktop-schemas/50/gsettings-desktop-schemas-50.1.tar.xz"
file = "gsettings-desktop-schemas-50.1.tar.xz"
sha256 = "0a2aa25082672585d16fcdab61c7b0e33f035fb87476505c794f29565afa485b"
[recipe.dependencies]
build = ["glib", "gobject-introspection"]
runtime = ["glib", "gobject-introspection"]
[recipe.build]
system = "meson"
sysroot_exclude = ["glibc"]
configure_options = ["-Dintrospection=true"]
inputs = ["distro/scripts/ki2-target-python3", "distro/scripts/ki2-target-g-ir-compiler", "distro/scripts/ki2-target-run"]
configure = [
  'install -Dm755 "${KI2_REPO_ROOT}/distro/scripts/ki2-target-python3" "${KI2_BUILD_DIR}/target-python3"',
  'sed -i "1c #!/usr/bin/env ${KI2_BUILD_DIR}/target-python3" "${KI2_SYSROOT}/usr/bin/g-ir-scanner"',
  'install -m755 "${KI2_SYSROOT}/usr/bin/g-ir-compiler" "${KI2_BUILD_DIR}/g-ir-compiler.real"',
  'install -m755 "${KI2_REPO_ROOT}/distro/scripts/ki2-target-g-ir-compiler" "${KI2_SYSROOT}/usr/bin/g-ir-compiler"',
  'meson setup "${KI2_BUILD_DIR}/schemas" "${KI2_SOURCE_DIR}" --prefix=/usr --libdir=lib -Dintrospection=true',
]
compile = ['meson compile -C "${KI2_BUILD_DIR}/schemas" -j "${KI2_JOBS}"']
install = ['DESTDIR="${KI2_DESTDIR}" meson install -C "${KI2_BUILD_DIR}/schemas"']
[recipe.build.env]
CFLAGS = "${KI2_SYSROOT_CPPFLAGS} -O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2"
LDFLAGS = "${KI2_SYSROOT_LDFLAGS} -Wl,-z,relro,-z,now"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONHASHSEED = "0"

