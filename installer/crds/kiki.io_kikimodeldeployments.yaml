apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kikimodeldeployments.kiki.io
spec:
  group: kiki.io
  scope: Namespaced
  names:
    plural: kikimodeldeployments
    singular: kikimodeldeployment
    kind: KikiModelDeployment
    shortNames: [kmd]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [modelRef, placement, endpoint, cache]
              properties:
                modelRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1}
                placement:
                  type: object
                  properties:
                    runtime: {type: string, enum: [auto, llama.cpp, vllm], default: auto}
                    accelerator: {type: string, enum: [auto, cpu, nvidia, amd, intel], default: auto}
                    nodeName: {type: string}
                endpoint:
                  type: object
                  required: [visibility]
                  properties:
                    visibility: {type: string, enum: [internal, project]}
                    port: {type: integer, minimum: 1024, maximum: 65535, default: 8000}
                    contextLength: {type: integer, minimum: 512, default: 8192}
                cache:
                  type: object
                  required: [persistentVolumeClaim]
                  properties:
                    persistentVolumeClaim: {type: string, minLength: 1}
                    modelPath:
                      type: string
                      pattern: '^/models/[^.][^[:space:]]*$'
                resources:
                  type: object
                  properties:
                    cpu: {type: string, default: '4'}
                    memory: {type: string, default: 8Gi}
            status:
              type: object
              properties:
                phase: {type: string, enum: [Pending, Pulling, Starting, Ready, Failed, Stopped]}
                engine: {type: string}
                backend: {type: string}
                nodeName: {type: string}
                endpoint: {type: string}
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ['True', 'False', Unknown]}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.modelRef.name
        - name: Engine
          type: string
          jsonPath: .status.engine
        - name: Backend
          type: string
          jsonPath: .status.backend
        - name: Phase
          type: string
          jsonPath: .status.phase
