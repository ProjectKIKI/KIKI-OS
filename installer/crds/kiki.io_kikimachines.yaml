apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kikimachines.kiki.io
spec:
  group: kiki.io
  scope: Namespaced
  names:
    plural: kikimachines
    singular: kikimachine
    kind: KikiMachine
    shortNames:
      - km
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - role
                - installConfigRef
              properties:
                role:
                  type: string
                  enum:
                    - controller
                    - compute
                installConfigRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                providerID:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                nodeRef:
                  type: object
                  properties:
                    name:
                      type: string
                lastHeartbeatTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Role
          type: string
          jsonPath: .spec.role
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Node
          type: string
          jsonPath: .status.nodeRef.name
