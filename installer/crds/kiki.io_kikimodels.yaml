apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kikimodels.kiki.io
spec:
  group: kiki.io
  scope: Namespaced
  names:
    plural: kikimodels
    singular: kikimodel
    kind: KikiModel
    shortNames: [kmodel]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [digest, format, source, sizeBytes, minimumMemoryBytes, license]
              properties:
                digest:
                  type: string
                  pattern: '^sha256:[a-f0-9]{64}$'
                format:
                  type: string
                  enum: [gguf, safetensors]
                source:
                  type: string
                  pattern: '^oci://.+'
                sizeBytes:
                  type: integer
                  format: int64
                  minimum: 1
                minimumMemoryBytes:
                  type: integer
                  format: int64
                  minimum: 1
                minimumVRAMBytes:
                  type: integer
                  format: int64
                  minimum: 0
                license:
                  type: object
                  required: [id, accepted]
                  properties:
                    id: {type: string, minLength: 1}
                    accepted: {type: boolean}
            status:
              type: object
              properties:
                phase: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ['True', 'False', Unknown]}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Format
          type: string
          jsonPath: .spec.format
        - name: Digest
          type: string
          jsonPath: .spec.digest
        - name: Phase
          type: string
          jsonPath: .status.phase
