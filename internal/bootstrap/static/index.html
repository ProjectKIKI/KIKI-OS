<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIKI Bootstrap Dashboard</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #fff;
      --text: #1d2430;
      --muted: #667085;
      --line: #d7dce3;
      --accent: #0f766e;
      --danger: #b42318;
      --warn: #b54708;
      --ok: #067647;
      --pending: #475467;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
    .auth { display: flex; align-items: center; gap: 8px; }
    input { min-height: 34px; min-width: 240px; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    main { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(420px, 1.2fr); gap: 18px; padding: 18px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
    button { appearance: none; border: 1px solid var(--line); background: #fff; color: var(--text); min-height: 34px; border-radius: 6px; padding: 7px 10px; cursor: pointer; font-weight: 600; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; word-break: break-word; }
    th { color: var(--muted); font-weight: 700; background: #fafbfc; }
    tr[data-node] { cursor: pointer; }
    tr[data-node]:hover { background: #f3faf9; }
    .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; background: #eef2f6; color: var(--pending); }
    .phase-booted, .phase-installed { background: #dcfae6; color: var(--ok); }
    .phase-failed { background: #fee4e2; color: var(--danger); }
    .phase-installing { background: #fef0c7; color: var(--warn); }
    .body { padding: 14px 16px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-height: 66px; }
    .label { color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .value { font-size: 14px; font-weight: 700; word-break: break-word; }
    pre { margin: 0; padding: 12px; background: #111827; color: #f9fafb; overflow: auto; border-radius: 6px; max-height: 280px; font-size: 12px; line-height: 1.5; }
    .split { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .muted { color: var(--muted); }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>KIKI Bootstrap Dashboard</h1>
    <div class="auth">
      <input id="admin-token" type="password" autocomplete="current-password" placeholder="Bootstrap admin token">
      <button onclick="connect()">Connect</button>
      <button onclick="refresh()">Refresh</button>
      <span id="connection" class="muted">Not connected</span>
    </div>
  </header>
  <main>
    <section>
      <div class="section-head">
        <h2>Nodes</h2>
        <span id="node-count" class="muted">0 nodes</span>
      </div>
      <div style="overflow:auto">
        <table>
          <thead><tr><th>Hostname</th><th>Role</th><th>Phase</th><th>Heartbeat</th></tr></thead>
          <tbody id="nodes"></tbody>
        </table>
      </div>
    </section>
    <section>
      <div class="section-head">
        <h2>Node Detail</h2>
        <button class="primary" onclick="diagnose()">Diagnose</button>
      </div>
      <div class="body split">
        <div class="grid" id="detail"></div>
        <div><div class="label">Recent Events</div><pre id="events">Select a node</pre></div>
        <div><div class="label">Diagnostics</div><pre id="diagnostics">No diagnostics yet</pre></div>
      </div>
    </section>
    <section>
      <div class="section-head"><h2>Images</h2><span class="muted">Mirror plans</span></div>
      <div class="body"><pre id="images">Loading...</pre></div>
    </section>
    <section>
      <div class="section-head"><h2>Artifacts</h2><span class="muted">ISO, overlays, logs</span></div>
      <div class="body"><pre id="artifacts">Loading...</pre></div>
    </section>
    <section>
      <div class="section-head"><h2>Event Stream</h2></div>
      <div class="body"><pre id="stream">Loading...</pre></div>
    </section>
  </main>
  <script>
    let selectedNode = null;
    let adminToken = sessionStorage.getItem('kikiBootstrapAdminToken') || '';
    document.getElementById('admin-token').value = adminToken;
    async function api(path, options) {
      const requestOptions = options ? { ...options } : {};
      requestOptions.headers = new Headers(requestOptions.headers || {});
      if (adminToken) requestOptions.headers.set('Authorization', `Bearer ${adminToken}`);
      const res = await fetch(path, requestOptions);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }
    function connect() {
      adminToken = document.getElementById('admin-token').value.trim();
      if (adminToken) sessionStorage.setItem('kikiBootstrapAdminToken', adminToken);
      else sessionStorage.removeItem('kikiBootstrapAdminToken');
      refresh();
    }
    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }
    function pill(phase) {
      const value = phase || 'pending';
      const cssValue = String(value).replace(/[^a-z0-9_-]/gi, '-');
      return `<span class="pill phase-${cssValue}">${escapeHTML(value)}</span>`;
    }
    function cell(value) {
      return value === null || value === undefined || value === '' ? '<span class="muted">-</span>' : escapeHTML(value);
    }
    function metric(label, value) {
      return `<div class="metric"><div class="label">${label}</div><div class="value">${cell(value)}</div></div>`;
    }
    async function refresh() {
      try {
      const nodes = await api('/api/v1/nodes');
      document.getElementById('connection').textContent = 'Connected';
      document.getElementById('node-count').textContent = `${nodes.length} nodes`;
      document.getElementById('nodes').innerHTML = nodes.map(n => `
        <tr data-node="${n.name}" onclick="selectNode('${String(n.name).replace(/'/g, "\\'")}')">
          <td>${cell(n.name)}</td><td>${cell(n.role)}</td><td>${pill(n.phase)}</td><td>${cell(n.last_heartbeat_at)}</td>
        </tr>`).join('');
      if (!selectedNode && nodes.length) selectedNode = nodes[0].name;
      if (selectedNode) await selectNode(selectedNode);
      document.getElementById('stream').textContent = JSON.stringify(await api('/api/v1/events?limit=30'), null, 2);
      document.getElementById('images').textContent = JSON.stringify(await api('/api/v1/images'), null, 2);
      document.getElementById('artifacts').textContent = JSON.stringify(await api('/api/v1/artifacts'), null, 2);
      } catch (error) {
        document.getElementById('connection').textContent = 'Authentication failed';
        document.getElementById('stream').textContent = String(error);
      }
    }
    async function selectNode(name) {
      selectedNode = name;
      const node = await api(`/api/v1/nodes/${encodeURIComponent(name)}`);
      document.getElementById('detail').innerHTML = [
        metric('Hostname', node.hostname || node.name),
        metric('Role', node.role),
        metric('Phase', node.phase),
        metric('Cluster', node.cluster_name),
        metric('Boot Mode', node.boot_mode),
        metric('Disk', node.disk),
        metric('OS', [node.os_distribution, node.os_release, node.os_architecture].filter(Boolean).join(' ')),
        metric('Last Error', node.last_error)
      ].join('');
      document.getElementById('events').textContent = JSON.stringify(node.events || [], null, 2);
      document.getElementById('diagnostics').textContent = (node.diagnostics || []).length
        ? node.diagnostics.map(d => `[${d.created_at}] ${d.provider}\n${d.summary}`).join('\n\n')
        : 'No diagnostics yet';
    }
    async function diagnose() {
      if (!selectedNode) return;
      await api(`/api/v1/nodes/${encodeURIComponent(selectedNode)}/diagnose`, { method: 'POST' });
      await selectNode(selectedNode);
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
