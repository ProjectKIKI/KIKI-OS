apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiki-infraops
  namespace: kiki-system
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiki-agent
  namespace: kiki-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kiki-model-runtime-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["kiki.io"]
    resources: ["kikimodels", "kikimodeldeployments", "kikiruntimeprofiles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kiki.io"]
    resources: ["kikimodeldeployments/status", "kikimodels/status", "kikiruntimeprofiles/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiki-model-runtime-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kiki-model-runtime-controller
subjects:
  - kind: ServiceAccount
    name: kiki-infraops
    namespace: kiki-system
